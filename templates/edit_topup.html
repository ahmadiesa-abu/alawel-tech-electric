<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Topup</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Edit Topup (ID: {{ topup.id }})</h1>
        <form method="POST" class="p-4 border rounded bg-white shadow-sm">
            <div class="mb-3">
                <label for="amount" class="form-label">Amount (₪):</label>
                <input type="number" step="0.01" id="amount" name="amount" class="form-control" value="{{ topup.amount }}" required>
            </div>
            <div class="mb-3">
                <label for="created_at" class="form-label">Date and Time:</label>
                <input type="datetime-local" id="created_at" name="created_at" class="form-control" value="{{ topup.created_at.strftime('%Y-%m-%dT%H:%M') if topup.created_at else '' }}">
                <div class="form-text">Leave blank to keep current time or clear it.</div>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('show_topups', customer_id=topup.customer_id) }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
