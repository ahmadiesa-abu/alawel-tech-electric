<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Customers</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">All Customers</h1>
        <div class="mb-4">
            <div class="input-group">
                <input type="text" id="searchInput" class="form-control" placeholder="Type here to search by name or account number...">
            </div>
        </div>
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Account Number</th>
                    <th>Account Type</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="customersTableBody">
                {% for customer in customers %}
                <tr>
                    <td>{{ customer.id }}</td>
                    <td>{{ customer.name }}</td>
                    <td>{{ customer.account_number }}</td>
                    <td>{{ customer.account_type }}</td>
                    <td>
                        <a href="{{ url_for('edit_customer', customer_id=customer.id) }}" class="btn btn-sm btn-warning">Edit Customer</a>
                        <a href="{{ url_for('show_topups', customer_id=customer.id) }}" class="btn btn-sm btn-info">View Topups</a>
                        <a href="{{ url_for('new_topup', customer_id=customer.id) }}" class="btn btn-sm btn-success">Add Topup</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <div class="text-center mt-4">
            <a href="{{ url_for('new_customer') }}" class="btn btn-primary">Add New Customer</a>
            <a href="{{ url_for('all_topups') }}" class="btn btn-success">View All Topups</a>
            <a href="{{ url_for('statistics') }}" class="btn btn-info">View Statistics</a>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('searchInput').addEventListener('keyup', function() {
            let filter = this.value.toLowerCase();
            let rows = document.getElementById('customersTableBody').getElementsByTagName('tr');

            for (let i = 0; i < rows.length; i++) {
                let nameCol = rows[i].getElementsByTagName('td')[1];
                let accCol = rows[i].getElementsByTagName('td')[2];
                let typeCol = rows[i].getElementsByTagName('td')[3];
                if (nameCol || accCol || typeCol) {
                    let nameText = nameCol.textContent || nameCol.innerText;
                    let accText = accCol.textContent || accCol.innerText;
                    let typeText = typeCol ? (typeCol.textContent || typeCol.innerText) : '';
                    if (nameText.toLowerCase().indexOf(filter) > -1 || accText.toLowerCase().indexOf(filter) > -1 || typeText.toLowerCase().indexOf(filter) > -1) {
                        rows[i].style.display = '';
                    } else {
                        rows[i].style.display = 'none';
                    }
                }
            }
        });
    </script>
</body>
</html>
